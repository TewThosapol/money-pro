<script>
  // แสดงข้อผิดพลาดของสคริปต์บนหน้าจอ (ช่วยวินิจฉัยเวลาหน้าโหลดไม่ขึ้น)
  window.__bootErrors = [];
  window.addEventListener('error', function (e) {
    var msg = (e.message || 'Script error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '');
    window.__bootErrors.push(msg);
    var el = document.getElementById('loading');
    if (el) el.insertAdjacentHTML('beforeend', '<p style="color:#b42318;font-size:12px;margin-top:8px">' + msg.replace(/</g, '&lt;') + '</p>');
  }, true);
</script>

<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          paper: 'rgb(var(--paper) / <alpha-value>)',
          surface: 'rgb(var(--surface) / <alpha-value>)',
          ink: 'rgb(var(--ink) / <alpha-value>)',
          muted: 'rgb(var(--muted) / <alpha-value>)',
          rule: 'rgb(var(--rule) / <alpha-value>)',
          income: 'rgb(var(--income) / <alpha-value>)',
          expense: 'rgb(var(--expense) / <alpha-value>)',
          accent: 'rgb(var(--accent) / <alpha-value>)',

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
  :root {
    --paper: 244 246 249; --surface: 255 255 255; --ink: 15 30 51; --muted: 92 105 126; --rule: 223 227 234;
    --income: 14 124 102; --expense: 180 35 24; --accent: 37 76 168; --warn: 168 108 18;
    --need: 37 76 168; --want: 196 131 20;
    color-scheme: light;
  }
  .dark {
    --paper: 10 17 29; --surface: 17 26 41; --ink: 229 234 242; --muted: 145 158 178; --rule: 37 49 68;
    --income: 61 196 158; --expense: 247 112 100; --accent: 125 155 255; --warn: 230 170 70;
    --need: 125 155 255; --want: 236 178 72;
    color-scheme: dark;
  }
  html, body { background: rgb(var(--paper)); color: rgb(var(--ink)); }
  body { font-family: 'Anuphan', system-ui, sans-serif; font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  :focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; border-radius: 6px; }

  /* Panels: ใช้เส้นขอบแทนเงา ให้ดูเป็นเอกสารการเงิน */
  .panel { background: rgb(var(--surface)); border: 1px solid rgb(var(--rule)); border-radius: 14px; }
  .panel-h { display:flex; align-items:baseline; gap:.75rem; padding: 1rem 1.25rem .5rem; }
  .panel-h h2 { font-size: 1.02rem; font-weight: 600; }
  .panel-b { padding: .5rem 1.25rem 1.25rem; }
  .sub { color: rgb(var(--muted)); font-size: .85rem; }

  :where(.btn) { display:inline-flex; }
  .btn { align-items:center; gap:.45rem; border-radius: 10px; padding: .55rem .95rem; font-weight: 500; font-size: .92rem; transition: background-color .15s, border-color .15s; white-space: nowrap; }
  .btn-primary { background: rgb(var(--ink)); color: rgb(var(--surface)); }
  .btn-primary:hover { background: rgb(var(--ink) / .86); }
  .btn-ghost { border: 1px solid rgb(var(--rule)); background: rgb(var(--surface)); }
  .btn-ghost:hover { border-color: rgb(var(--muted) / .6); }
  .btn-danger { background: rgb(var(--expense)); color: #fff; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  :where(.icon-btn) { display:grid; }
  .icon-btn { width: 2.1rem; height: 2.1rem; place-items:center; border-radius: 8px; color: rgb(var(--muted)); }
  .icon-btn:hover { background: rgb(var(--rule) / .6); color: rgb(var(--ink)); }

  .field { width:100%; background: rgb(var(--paper)); border:1px solid rgb(var(--rule)); border-radius:10px; padding:.6rem .8rem; color: rgb(var(--ink)); }
  .field:focus { outline:none; border-color: rgb(var(--accent)); background: rgb(var(--surface)); }
  select.field { cursor:pointer; }
  .label { display:block; font-size:.85rem; font-weight:500; margin-bottom:.3rem; }

  :where(.seg) { display:inline-flex; }
  .seg { background: rgb(var(--paper)); border:1px solid rgb(var(--rule)); border-radius:10px; padding:3px; }
  .seg button { padding:.35rem .8rem; border-radius:7px; font-size:.88rem; color: rgb(var(--muted)); }
  .seg button[aria-pressed="true"] { background: rgb(var(--surface)); color: rgb(var(--ink)); box-shadow: 0 1px 2px rgb(0 0 0 / .08); font-weight:500; }

  :where(.nav-link) { display:flex; }
  .nav-link { align-items:center; gap:.7rem; padding:.55rem .75rem; border-radius:9px; color: rgb(var(--muted)); font-weight:500; }
  .nav-link:hover { color: rgb(var(--ink)); background: rgb(var(--rule) / .45); }
  .nav-link[aria-current="page"] { color: rgb(var(--ink)); background: rgb(var(--rule) / .7); }

  :where(.tab-link) { display:flex; }
  .tab-link { position:relative; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:62px; font-size:.82rem; font-weight:500; color: rgb(var(--muted)); }
  .tab-link [data-lucide], .tab-link svg { width:24px; height:24px; stroke-width:2; }
  .tab-link[aria-current="page"] { color: rgb(var(--accent)); font-weight:600; }
  .tab-link[aria-current="page"]::before { content:''; position:absolute; top:0; left:28%; right:28%; height:3px; border-radius:0 0 3px 3px; background: rgb(var(--accent)); }
  .tab-add { display:grid; place-items:center; min-height:62px; }
  .tab-add > span { width:52px; height:52px; border-radius:16px; display:grid; place-items:center; background: rgb(var(--accent)); color:#fff; box-shadow: 0 6px 16px -6px rgb(var(--accent) / .7); }
  .tab-add [data-lucide], .tab-add svg { width:26px; height:26px; stroke-width:2.4; }

  table.ledger { width:100%; border-collapse: collapse; }
  table.ledger th { text-align:left; font-weight:500; font-size:.8rem; color: rgb(var(--muted)); padding:.55rem .75rem; border-bottom:1px solid rgb(var(--rule)); white-space:nowrap; }
  table.ledger td { padding:.6rem .75rem; border-bottom:1px solid rgb(var(--rule) / .7); vertical-align: middle; }
  table.ledger tr:last-child td { border-bottom: 0; }
  table.ledger .r { text-align:right; }
  table.ledger tbody tr:hover td { background: rgb(var(--paper) / .7); }

  /* ตารางเปรียบเทียบรายเดือน: คอลัมน์แรกติดซ้ายเวลาเลื่อน */
  .matrix { border-collapse: separate; border-spacing:0; min-width:100%; }
  .matrix th, .matrix td { padding:.5rem .7rem; white-space:nowrap; border-bottom:1px solid rgb(var(--rule) / .7); text-align:right; }
  .matrix th { font-size:.8rem; font-weight:500; color: rgb(var(--muted)); position: sticky; top: 0; background: rgb(var(--surface)); }
  .matrix .stick { position: sticky; left: 0; background: rgb(var(--surface)); text-align:left; z-index: 1; border-right:1px solid rgb(var(--rule)); }
  .matrix tr.total td { font-weight:600; border-top:1px solid rgb(var(--ink) / .5); }
  .matrix tr.group td { color: rgb(var(--muted)); font-size:.78rem; padding-top:1rem; text-align:left; border-bottom:0; }

  :where(.chip) { display:inline-flex; }
  .chip { align-items:center; gap:.3rem; font-size:.75rem; font-weight:500; border-radius:999px; padding:.1rem .55rem; white-space:nowrap; }
  .chip-up { color: rgb(var(--expense)); background: rgb(var(--expense) / .1); }
  .chip-down { color: rgb(var(--income)); background: rgb(var(--income) / .12); }
  .chip-flat { color: rgb(var(--muted)); background: rgb(var(--rule) / .7); }
  .chip-warn { color: rgb(var(--warn)); background: rgb(var(--warn) / .12); }

  .bar { height: 8px; border-radius: 999px; background: rgb(var(--rule)); overflow: hidden; }
  .bar > span { display:block; height:100%; border-radius:999px; }

  :where(.cat-ico) { display:grid; }
  .cat-ico { width:2.1rem; height:2.1rem; border-radius:9px; place-items:center; flex-shrink:0; }
  .cat-ico [data-lucide], .cat-ico svg { width:1.05rem; height:1.05rem; }
  [data-lucide] { width:1.1em; height:1.1em; stroke-width:2; }

  .insight { display:grid; grid-template-columns: 4px 1fr; gap:.85rem; padding:.85rem 0; border-bottom:1px solid rgb(var(--rule) / .7); }
  .insight:last-child { border-bottom:0; }
  .insight::before { content:''; border-radius:4px; }
  .insight.bad::before { background: rgb(var(--expense)); }
  .insight.warn::before { background: rgb(var(--warn)); }
  .insight.good::before { background: rgb(var(--income)); }
  .insight.info::before { background: rgb(var(--accent)); }

  /* แถบการจัดสรรรายได้ (จุดเด่นของหน้าภาพรวม) */
  .alloc { position: relative; height: 46px; border-radius: 10px; overflow: hidden; display:flex; background: rgb(var(--rule) / .7); }
  .alloc > div { height:100%; min-width:0; flex-shrink:0; display:flex; align-items:center; padding: 0 .7rem; color:#fff; font-size:.82rem; font-weight:600; overflow:hidden; white-space:nowrap; transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .alloc-marks { position: relative; height: 22px; }
  .alloc-marks span { position:absolute; top:0; transform: translateX(-50%); font-size:.72rem; color: rgb(var(--muted)); white-space:nowrap; }
  .alloc-marks span::before { content:''; position:absolute; left:50%; top:-52px; height:52px; border-left: 1.5px dashed rgb(var(--ink) / .55); }

  .modal-back { position:fixed; inset:0; background: rgb(8 14 26 / .5); z-index:50; }
  .modal { position:fixed; z-index:51; background: rgb(var(--surface)); border:1px solid rgb(var(--rule)); }
  @media (min-width: 640px) { .modal { left:50%; top:50%; transform: translate(-50%,-50%); width: min(560px, calc(100vw - 2rem)); max-height: calc(100vh - 3rem); border-radius: 16px; overflow:auto; } }
  @media (max-width: 639px) {
    .modal-c .mh { padding: .85rem 1rem .6rem; }
    .modal-c .mh h3 { font-size: 1.05rem; }
    .modal-c .mb { padding: .75rem 1rem; }
    .modal-c .mb > * + * { margin-top: .7rem !important; }
    .modal-c .mf { padding: .6rem 1rem; }
    .modal-c .mf .btn { padding: .6rem 1.1rem; }
    .modal-c .label { font-size: .8rem; margin-bottom: .2rem; }
    .modal-c .field { padding: .5rem .7rem; font-size: 16px; }
    .modal-c .seg button { padding: .3rem .5rem; }
    .modal-c .drop { padding: .5rem .65rem; }
    .modal-c .drop .cat-ico { width: 1.9rem; height: 1.9rem; }
  }
  input[type="date"].field { min-width:0; -webkit-appearance:none; appearance:none; text-align:left; min-height: 2.6rem; }
  input[type="date"].field::-webkit-date-and-time-value { text-align:left; }
  @media (max-width: 639px) { .modal { left:0; right:0; bottom:0; max-height: 88vh; border-radius: 18px 18px 0 0; overflow:auto; padding-bottom: env(safe-area-inset-bottom); animation: sheet .25s cubic-bezier(.2,.8,.2,1); } }
  @keyframes sheet { from { transform: translateY(40px); opacity:.4 } to { transform:none; opacity:1 } }

  .drop { border:1.5px dashed rgb(var(--rule)); border-radius:12px; transition: border-color .15s, background-color .15s; }
  .drop.over, .drop:hover { border-color: rgb(var(--accent)); background: rgb(var(--accent) / .04); }
  .autofilled { box-shadow: 0 0 0 2px rgb(var(--accent) / .35); }
  @keyframes spin { to { transform: rotate(360deg) } }
  .spin { animation: spin 1s linear infinite; }

  .scroll-x { overflow-x:auto; -webkit-overflow-scrolling: touch; }
  .hidden-important { display:none !important; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  @media print {
    aside, .tabbar, .topbar-actions, .no-print, .modal, .modal-back, #toast { display:none !important; }
    body { background:#fff; font-size: 12px; }
    .panel { border-color:#ccc; break-inside: avoid; }
    main { padding: 0 !important; }
  }
</style>
</head>

<div class="md:flex min-h-screen">

<script>
'use strict';
/* =====================================================================
 * Constants
 * =================================================================== */
const VIEWS = {
  overview:     { title: 'ภาพรวม',        icon: 'layout-dashboard' },
  analysis:     { title: 'วิเคราะห์การใช้จ่าย', icon: 'chart-pie' },
  transactions: { title: 'รายการ',         icon: 'list' },
  budgets:      { title: 'งบประมาณ',       icon: 'target' },
  savings:      { title: 'เงินออม',        icon: 'piggy-bank' },
  recurring:    { title: 'รายการประจำ',     icon: 'repeat' },
  settings:     { title: 'ตั้งค่า',          icon: 'settings' },
};
const ACCOUNT_TYPES = { cash: 'เงินสด', bank: 'บัญชีธนาคาร', credit: 'บัตรเครดิต', ewallet: 'e-Wallet', saving: 'บัญชีออมทรัพย์', invest: 'การลงทุน' };
const ACCOUNT_ICONS = { cash: 'banknote', bank: 'landmark', credit: 'credit-card', ewallet: 'smartphone', saving: 'piggy-bank', invest: 'trending-up' };
const ICON_CHOICES = ['utensils', 'coffee', 'home', 'zap', 'droplets', 'car', 'fuel', 'bus', 'train-front', 'plane', 'receipt', 'wifi', 'smartphone',
  'heart-pulse', 'dumbbell', 'shopping-bag', 'shirt', 'gift', 'clapperboard', 'gamepad-2', 'music', 'graduation-cap', 'book-open', 'baby',
  'shield', 'wrench', 'circle-ellipsis', 'briefcase', 'award', 'laptop', 'trending-up', 'hand-coins', 'piggy-bank', 'wallet', 'plus-circle', 'tag'];
const COLOR_CHOICES = ['#F97316', '#EF4444', '#EC4899', '#A855F7', '#4F46E5', '#2563EB', '#0EA5E9', '#14B8A6', '#10B981', '#84CC16', '#EAB308', '#64748B'];
const RULE = { need: 0.5, want: 0.3, save: 0.2 };
const PAGE_SIZE = 25;
// Apps Script ตัดข้อความแบบคอมเมนต์ทิ้งแม้อยู่ในสตริง จึงห้ามมีเครื่องหมายเปิด/ปิดคอมเมนต์ในสตริง
const RCPT_ACCEPT = ['image', '*,application', 'pdf'].join('/');
const SAVING_TYPES = ['saving', 'invest'];
/** หมวดย่อย (เลือกเพิ่มในฟอร์มเมื่อเลือกหมวดนี้) */
const SUBCATS = { food: ['อาหารเช้า', 'อาหารกลางวัน', 'อาหารเย็น', 'ของว่าง/เครื่องดื่ม'] };
/** เดามื้อจากเวลา hh:mm */
function mealByTime(hhmm) {
  const [h, m] = String(hhmm || '').split(':').map(Number);
  if (!isFinite(h)) return '';
  const t = h * 60 + (m || 0);
  if (t >= 300 && t < 630) return 'อาหารเช้า';
  if (t >= 630 && t < 900) return 'อาหารกลางวัน';
  if (t >= 1020 && t < 1290) return 'อาหารเย็น';
  return 'ของว่าง/เครื่องดื่ม';
}
const nowHHMM = () => { const d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const TRANSFER_CAT = { id: '', name: 'โอน/ออม', icon: 'arrow-left-right', color: '#64748B', type: 'transfer', group: '' };
// Apps Script ตัดข้อความหลังเครื่องหมายทับสองตัวในสคริปต์ทิ้ง จึงต่อ URL ด้วย join แทน
const driveUrl = (id) => ['https:', '', 'drive.google.com', 'file', 'd', encodeURIComponent(id), 'view'].join('/');

/* =====================================================================
 * Utils
 * =================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = (n) => Math.round(n * 100) / 100;
const pad2 = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const parseYmd = (s) => new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const monthOf = (s) => s.slice(0, 7);
const addMonths = (ym, n) => { const d = new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); };
const monthEnd = (ym) => { const d = new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0); return ymd(d); };
const monthsBetween = (a, b) => { const out = []; let m = a; while (m <= b && out.length < 240) { out.push(m); m = addMonths(m, 1); } return out; };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000) + 1;

function money(n, opts = {}) {
  const v = Number(n) || 0;
  const a = Math.abs(v);
  const s = a.toLocaleString('th-TH', { minimumFractionDigits: opts.dec || Math.round(a * 100) % 100 ? 2 : 0, maximumFractionDigits: 2 });
  const sign = v < 0 ? '−' : (opts.sign && v > 0 ? '+' : '');
  return sign + '฿' + s;
}
function moneyShort(n) {
  const v = Math.abs(n);
  if (v >= 1e6) return (n / 1e6).toFixed(v >= 1e7 ? 0 : 1) + 'M';
  if (v >= 1e3) return (n / 1e3).toFixed(v >= 1e4 ? 0 : 1) + 'k';
  return String(Math.round(n));
}
const pct = (n, d = 0) => (n == null || !isFinite(n)) ? '–' : (n * 100).toFixed(d) + '%';
function thMonth(ym, short) {
  const d = new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1, 1);
  return d.toLocaleDateString('th-TH', short ? { month: 'short', year: '2-digit' } : { month: 'long', year: 'numeric' });
}
function thDate(s, withYear) {
  return parseYmd(s).toLocaleDateString('th-TH', withYear ? { day: 'numeric', month: 'short', year: '2-digit' } : { weekday: 'short', day: 'numeric', month: 'short' });
}
function change(cur, prev) {
  if (!prev) return cur ? { pct: null, dir: 'up' } : { pct: 0, dir: 'flat' };
  const p = (cur - prev) / Math.abs(prev);
  return { pct: p, dir: Math.abs(p) < 0.03 ? 'flat' : p > 0 ? 'up' : 'down' };
}
/** chip แสดงการเปลี่ยนแปลง (goodWhenUp = ตัวเลขขึ้นแล้วดี เช่น รายรับ) */
function deltaChip(cur, prev, goodWhenUp) {
  const c = change(cur, prev);
  if (c.dir === 'flat') return `<span class="chip chip-flat">ทรงตัว</span>`;
  const good = (c.dir === 'up') === !!goodWhenUp;
  const cls = good ? 'chip-down' : 'chip-up';
  const arrow = c.dir === 'up' ? 'arrow-up-right' : 'arrow-down-right';
  const txt = c.pct == null ? 'ใหม่' : Math.abs(c.pct * 100).toFixed(0) + '%';
  return `<span class="chip ${cls}"><i data-lucide="${arrow}" class="!w-3 !h-3"></i>${txt}</span>`;
}
const icons = () => { if (window.lucide) lucide.createIcons(); };
const cssColor = (v, a = 1) => `rgb(${getComputedStyle(document.documentElement).getPropertyValue('--' + v).trim()} / ${a})`;
const tint = (hex, a) => hex + Math.round(a * 255).toString(16).padStart(2, '0');

let toastT;
function toast(msg, kind) {
  const t = $('#toast');
  const ic = kind === 'error' ? 'circle-alert' : 'circle-check';
  t.innerHTML = `<i data-lucide="${ic}"></i><span>${esc(msg)}</span>`;
  t.classList.remove('hidden');
  icons();
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.add('hidden'), kind === 'error' ? 5000 : 2600);
}

function api(fn, ...args) {
  if (IS_GAS) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve)
        .withFailureHandler((e) => reject(e instanceof Error ? e : new Error(String((e && e.message) || e))))[fn](...args);
    });
  }
  return new Promise((resolve, reject) => setTimeout(() => { try { resolve(Demo[fn](...args)); } catch (e) { reject(e); } }, 180));
}

 * State
 * =================================================================== */
const S = {
  today: ymd(new Date()),
  accounts: [], categories: [], recurring: [], goals: [], settings: {},
  tx: [], balances: {},
  catById: {}, accById: {}, monthly: {},
  view: 'overview',
  periodKey: '',
  custom: { from: '', to: '' },
  filters: { q: '', type: 'all', account: '', category: '' },
  page: 1,
  matrixMonths: 6,
  focusCat: '',
  charts: {},
};

function indexData() {
  S.catById = {}; S.categories.forEach((c) => { S.catById[c.id] = c; });
  S.accById = {}; S.accounts.forEach((a) => { S.accById[a.id] = a; });
  // ยอดรวมรายเดือน ใช้ในการเปรียบเทียบและค่าเฉลี่ย
  const m = {};
  S.tx.forEach((t) => {
    const k = monthOf(t.date);
    const row = m[k] || (m[k] = { income: 0, expense: 0, byCat: {}, toSavings: 0 });
    if (t.type === 'transfer') { row.toSavings += savingFlow(t); return; }
    row[t.type] += t.amount;
    row.byCat[t.category] = (row.byCat[t.category] || 0) + t.amount;
  });
  S.monthly = m;
}
const isSavingAcc = (id) => SAVING_TYPES.includes((S.accById[id] || {}).type);
/** ผลต่อเงินออมของรายการโอน: เข้าบัญชีออม = บวก, ถอนออกจากบัญชีออม = ลบ */
const savingFlow = (t) => (isSavingAcc(t.toAccount) ? t.amount : 0) - (isSavingAcc(t.account) ? t.amount : 0);
const cat = (id) => S.catById[id] || { id, name: 'ไม่ระบุหมวด', icon: 'tag', color: '#64748B', type: 'expense', group: 'want', monthlyBudget: 0 };
const acc = (id) => S.accById[id] || { id, name: 'ไม่ระบุบัญชี', type: 'bank', color: '#64748B' };
const activeCats = (type) => S.categories.filter((c) => !c.archived && (!type || c.type === type)).sort((a, b) => a.sortOrder - b.sortOrder);
const activeAccounts = () => S.accounts.filter((a) => !a.archived).sort((a, b) => a.sortOrder - b.sortOrder);

/* =====================================================================
 * Period
 * =================================================================== */
function periodOptions() {
  const cur = monthOf(S.today);
  const opts = [];
  for (let i = 0; i < 18; i++) {
    const m = addMonths(cur, -i);
    opts.push([`m:${m}`, (i === 0 ? 'เดือนนี้ ' : '') + thMonth(m)]);
  }
  opts.splice(2, 0, ['last3', '3 เดือนล่าสุด'], ['last6', '6 เดือนล่าสุด'], ['last12', '12 เดือนล่าสุด'], ['ytd', 'ปีนี้'], ['custom', 'กำหนดช่วงเอง…']);
  return opts;
}

/** ช่วงเวลาปัจจุบัน + ช่วงก่อนหน้าที่ยาวเท่ากัน */
function period() {
  const key = S.periodKey;
  const cur = monthOf(S.today);
  let from, to, label, prevFrom, prevTo, months;
  if (key.startsWith('m:')) {
    const m = key.slice(2);
    from = m + '-01'; to = monthEnd(m); label = thMonth(m);
    prevFrom = addMonths(m, -1) + '-01'; prevTo = monthEnd(addMonths(m, -1));
  } else if (/^last(\d+)$/.test(key)) {
    const n = +key.slice(4);
    from = addMonths(cur, -(n - 1)) + '-01'; to = monthEnd(cur); label = n + ' เดือนล่าสุด';
    prevFrom = addMonths(cur, -(2 * n - 1)) + '-01'; prevTo = monthEnd(addMonths(cur, -n));
  } else if (key === 'ytd') {
    const y = S.today.slice(0, 4);
    from = y + '-01-01'; to = S.today; label = 'ปี ' + (+y + 543);
    prevFrom = (+y - 1) + '-01-01'; prevTo = (+y - 1) + S.today.slice(4);
  } else {
    from = S.custom.from || addDays(S.today, -29); to = S.custom.to || S.today;
    if (from > to) [from, to] = [to, from];
    label = thDate(from, true) + ' – ' + thDate(to, true);
    const len = daysBetween(from, to);
    prevTo = addDays(from, -1); prevFrom = addDays(prevTo, -(len - 1));
  }
  months = monthsBetween(monthOf(from), monthOf(to));
  return { from, to, label, prevFrom, prevTo, months, isMonth: key.startsWith('m:'), endMonth: monthOf(to) };
}

const inRange = (from, to) => S.tx.filter((t) => t.date >= from && t.date <= to);

function summarize(list) {
  const s = { income: 0, expense: 0, byCat: {}, count: list.length, need: 0, want: 0, toSavings: 0 };
  list.forEach((t) => {
    if (t.type === 'transfer') { s.toSavings += savingFlow(t); return; }
    s[t.type] += t.amount;
    s.byCat[t.category] = (s.byCat[t.category] || 0) + t.amount;
    if (t.type === 'expense') s[cat(t.category).group === 'need' ? 'need' : 'want'] += t.amount;
  });
  s.net = s.income - s.expense;
  s.rate = s.income > 0 ? s.net / s.income : null;
  return s;
}

/** ค่าเฉลี่ยต่อเดือนของหมวดใน n เดือนก่อนเดือน beforeMonth (นับเฉพาะเดือนที่มีข้อมูล) */
function monthlyAvg(catId, beforeMonth, n = 3) {
  let total = 0, cnt = 0;
  for (let i = 1; i <= n; i++) {
    const m = S.monthly[addMonths(beforeMonth, -i)];
    if (m) { total += m.byCat[catId] || 0; cnt++; }
  }
  return cnt ? Math.round(total / cnt) : null;
}

/* =====================================================================
 * Insights — คำแนะนำที่คำนวณจากข้อมูลจริง
 * =================================================================== */
function buildInsights(P, cur, prev) {
  const out = [];
  const nM = P.months.length;
  const perM = (v) => v / nM;

  if (cur.income === 0 && cur.expense === 0) return [{ lv: 'info', t: 'ยังไม่มีรายการในช่วงนี้', d: 'บันทึกรายรับรายจ่ายเพื่อดูการวิเคราะห์' }];

  // 1) อัตราการออม
  if (cur.income > 0) {
    const target = cur.income * RULE.save;
    if (cur.net < 0) out.push({ lv: 'bad', t: `รายจ่ายเกินรายรับ ${money(-cur.net)}`, d: `ต้องลดรายจ่ายอย่างน้อย ${money(perM(-cur.net))} ต่อเดือนเพื่อให้สมดุล และอีก ${money(perM(target))} ต่อเดือนเพื่อเก็บออมได้ 20%` });
    else if (cur.rate < RULE.save) out.push({ lv: 'warn', t: `ออมได้ ${pct(cur.rate)} ของรายรับ`, d: `เกณฑ์แนะนำคือ 20% ควรออมเพิ่มอีกประมาณ ${money(perM(target - cur.net))} ต่อเดือน` });
    else out.push({ lv: 'good', t: `ออมได้ ${pct(cur.rate)} ของรายรับ`, d: `สูงกว่าเกณฑ์ 20% แล้ว เงินส่วนเกิน ${money(perM(cur.net - target))} ต่อเดือนนำไปลงทุนหรือเก็บเป็นเงินสำรองฉุกเฉินได้` });
  } else {
    out.push({ lv: 'warn', t: 'ยังไม่มีรายรับในช่วงนี้', d: 'บันทึกรายรับด้วยเพื่อให้คำนวณสัดส่วนและอัตราการออมได้' });
  }

  // 2) กฎ 50/30/20
  if (cur.income > 0) {
    const needR = cur.need / cur.income, wantR = cur.want / cur.income;
    if (needR > RULE.need) out.push({ lv: 'warn', t: `ค่าใช้จ่ายจำเป็น ${pct(needR)} ของรายรับ`, d: `เกินเกณฑ์ 50% อยู่ ${money(perM(cur.need - cur.income * RULE.need))} ต่อเดือน ลองทบทวนค่าที่พัก ค่าเดินทาง หรือแพ็กเกจรายเดือน` });
    if (wantR > RULE.want) out.push({ lv: 'warn', t: `ค่าใช้จ่ายตามใจ ${pct(wantR)} ของรายรับ`, d: `เกินเกณฑ์ 30% อยู่ ${money(perM(cur.want - cur.income * RULE.want))} ต่อเดือน ตัดส่วนนี้จะเพิ่มเงินออมได้ทันที` });
  }

  // 3) หมวดที่เปลี่ยนแปลงผิดปกติเมื่อเทียบค่าเฉลี่ย 3 เดือนก่อนหน้า
  const firstM = P.months[0];
  const changes = activeCats('expense').map((c) => {
    const now = perM(cur.byCat[c.id] || 0);
    const avg = monthlyAvg(c.id, firstM, 3);
    return { c, now, avg, diff: avg == null ? 0 : now - avg };
  }).filter((x) => x.avg != null && x.avg > 0);
  changes.filter((x) => x.diff > Math.max(300, x.avg * 0.2)).sort((a, b) => b.diff - a.diff).slice(0, 3).forEach((x) => {
    out.push({ lv: 'warn', cat: x.c.id, t: `${x.c.name} สูงกว่าปกติ ${pct(x.diff / x.avg)}`, d: `เฉลี่ย 3 เดือนก่อนอยู่ที่ ${money(x.avg)} ต่อเดือน ช่วงนี้ ${money(x.now)} ต่อเดือน ถ้าลดกลับมาระดับเดิมจะประหยัดได้ ${money(x.diff)} ต่อเดือน` });
  });
  changes.filter((x) => -x.diff > Math.max(300, x.avg * 0.2)).sort((a, b) => a.diff - b.diff).slice(0, 1).forEach((x) => {
    out.push({ lv: 'good', cat: x.c.id, t: `${x.c.name} ลดลง ${pct(-x.diff / x.avg)}`, d: `ใช้น้อยกว่าค่าเฉลี่ย 3 เดือน ${money(-x.diff)} ต่อเดือน รักษาระดับนี้ไว้` });
  });

  // 4) งบประมาณ
  activeCats('expense').filter((c) => c.monthlyBudget > 0).forEach((c) => {
    const budget = c.monthlyBudget * nM, spent = cur.byCat[c.id] || 0;
    if (spent > budget) out.push({ lv: 'bad', cat: c.id, t: `${c.name} เกินงบ ${money(spent - budget)}`, d: `ใช้ไป ${money(spent)} จากงบ ${money(budget)} (${pct(spent / budget)})` });
    else if (spent >= budget * 0.8 && P.to >= S.today) out.push({ lv: 'warn', cat: c.id, t: `${c.name} ใช้งบไปแล้ว ${pct(spent / budget)}`, d: `เหลืออีก ${money(budget - spent)} สำหรับช่วงที่เหลือ` });
  });

  // 5) ค่าที่พักเกิน 30% ของรายรับ
  const housing = cur.byCat.housing || 0;
  if (cur.income > 0 && housing / cur.income > 0.3) {
    out.push({ lv: 'info', cat: 'housing', t: `ค่าที่พัก ${pct(housing / cur.income)} ของรายรับ`, d: 'โดยทั่วไปไม่ควรเกิน 30% ถ้าสูงกว่านี้ต่อเนื่อง ลองพิจารณาทางเลือกที่ถูกลงเมื่อหมดสัญญา' });
  }
  const rank = { bad: 0, warn: 1, info: 2, good: 3 };
  return out.sort((a, b) => rank[a.lv] - rank[b.lv]);
}

/** คำแนะนำสั้นสำหรับแต่ละหมวดในตารางสัดส่วน */
function categoryAdvice(c, amountPerMonth, avg, incomePerMonth) {
  if (c.monthlyBudget > 0 && amountPerMonth > c.monthlyBudget) return { lv: 'up', txt: `ลด ${money(amountPerMonth - c.monthlyBudget)} ให้อยู่ในงบ` };
  if (avg != null && avg > 0 && amountPerMonth - avg > Math.max(300, avg * 0.2)) return { lv: 'up', txt: `ลด ${money(amountPerMonth - avg)} กลับสู่ค่าเฉลี่ย` };
  if (c.group === 'want' && incomePerMonth > 0 && amountPerMonth / incomePerMonth > 0.12) return { lv: 'warn', txt: `สูงกว่า 12% ของรายรับ ลองตั้งงบ ${money(Math.round(incomePerMonth * 0.1 / 100) * 100)}` };
  if (avg != null && avg > 0 && avg - amountPerMonth > Math.max(300, avg * 0.2)) return { lv: 'down', txt: 'ลดลงจากเดิม รักษาระดับนี้' };
  return { lv: 'flat', txt: 'อยู่ในระดับปกติ' };
}

/* =====================================================================
 * Charts
 * =================================================================== */
function chartBase() {
  Chart.defaults.font.family = "'Anuphan', sans-serif";
  Chart.defaults.color = cssColor('muted');
  Chart.defaults.borderColor = cssColor('rule');
}
function makeChart(key, canvas, cfg) {
  if (!window.Chart || !canvas) return;
  if (S.charts[key]) S.charts[key].destroy();
  chartBase();
  S.charts[key] = new Chart(canvas, cfg);
}
const tooltipMoney = { callbacks: { label: (ctx) => ` ${ctx.dataset.label || ctx.label}: ${money(ctx.parsed.y ?? ctx.parsed)}` } };

function cashflowChart(canvas, endMonth) {
  const months = []; for (let i = 11; i >= 0; i--) months.push(addMonths(endMonth, -i));
  const inc = months.map((m) => r2((S.monthly[m] || {}).income || 0));
  const exp = months.map((m) => r2((S.monthly[m] || {}).expense || 0));
  makeChart('cashflow', canvas, {
    data: {
      labels: months.map((m) => thMonth(m, true)),
      datasets: [
        { type: 'line', label: 'คงเหลือสุทธิ', data: inc.map((v, i) => r2(v - exp[i])), borderColor: cssColor('accent'), backgroundColor: cssColor('accent'), borderWidth: 2, pointRadius: 2.5, tension: 0.3, order: 0 },
        { type: 'bar', label: 'รายรับ', data: inc, backgroundColor: cssColor('income', 0.8), borderRadius: 4, maxBarThickness: 18, order: 1 },
        { type: 'bar', label: 'รายจ่าย', data: exp, backgroundColor: cssColor('expense', 0.75), borderRadius: 4, maxBarThickness: 18, order: 1 },
      ],
    },
    options: {
      maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      scales: { x: { grid: { display: false } }, y: { grid: { color: cssColor('rule', 0.7) }, border: { display: false }, ticks: { callback: moneyShort } } },
      plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8, padding: 16 } }, tooltip: tooltipMoney },
    },
  });
}

function donutChart(canvas, byCat) {
  const rows = activeCats('expense').map((c) => [c, byCat[c.id] || 0]).filter((x) => x[1] > 0).sort((a, b) => b[1] - a[1]);
  makeChart('donut', canvas, {
    type: 'doughnut',
    data: { labels: rows.map((x) => x[0].name), datasets: [{ data: rows.map((x) => r2(x[1])), backgroundColor: rows.map((x) => x[0].color), borderColor: cssColor('surface'), borderWidth: 2 }] },
    options: { maintainAspectRatio: false, cutout: '68%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => ` ${ctx.label}: ${money(ctx.parsed)}` } } } },
  });
}

function categoryTrendChart(canvas, catId, endMonth) {
  const c = cat(catId);
  const months = []; for (let i = 11; i >= 0; i--) months.push(addMonths(endMonth, -i));
  const data = months.map((m) => r2(((S.monthly[m] || {}).byCat || {})[catId] || 0));
  const withData = months.filter((m) => S.monthly[m]).length || 1;
  const avg = Math.round(data.reduce((a, b) => a + b, 0) / withData);
  const ds = [
    { type: 'bar', label: c.name, data, backgroundColor: tint(c.color, 0.75), borderRadius: 4, maxBarThickness: 22 },
    { type: 'line', label: 'ค่าเฉลี่ย 12 เดือน', data: data.map(() => r2(avg)), borderColor: cssColor('ink', 0.5), borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0 },
  ];
  if (c.monthlyBudget > 0) ds.push({ type: 'line', label: 'งบต่อเดือน', data: data.map(() => c.monthlyBudget), borderColor: cssColor('warn'), borderWidth: 1.5, pointRadius: 0 });
  makeChart('catTrend', canvas, {
    data: { labels: months.map((m) => thMonth(m, true)), datasets: ds },
    options: {
      maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { color: cssColor('rule', 0.7) }, border: { display: false }, ticks: { callback: moneyShort } } },
      plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8, padding: 14 } }, tooltip: tooltipMoney },
    },
  });
}

  <div class="py-14 text-center">
    <i data-lucide="${icon}" class="inline-block !w-8 !h-8 text-muted"></i>
    <p class="mt-3 font-medium">${title}</p>
    ${sub ? `<p class="sub mt-1">${sub}</p>` : ''}
    ${action || ''}

const attachLink = (t) => t.attachment ? `<a href="${driveUrl(t.attachment)}" target="_blank" rel="noopener" class="inline-flex text-muted hover:text-accent align-middle ml-1" title="ดูสลิป/ใบเสร็จ" aria-label="ดูสลิปหรือใบเสร็จ"><i data-lucide="paperclip" class="!w-3.5 !h-3.5"></i></a>` : '';

/** ข้อมูลสำหรับแสดงผลรายการ (รองรับรายการโอน) */
function txView(t) {
  if (t.type === 'transfer') {
    const toSave = isSavingAcc(t.toAccount) && !isSavingAcc(t.account);
    return { c: { ...TRANSFER_CAT, icon: toSave ? 'piggy-bank' : 'arrow-left-right', color: toSave ? '#0E7C66' : '#64748B' },
      title: t.note || (toSave ? 'ออมเงิน' : 'โอนเงิน'), catName: toSave ? 'ออมเงิน' : 'โอนระหว่างบัญชี',
      accText: `${acc(t.account).name} → ${acc(t.toAccount).name}`, amount: money(t.amount), cls: 'text-muted' };
  }
  const c = cat(t.category), inc = t.type === 'income';
  return { c, title: t.note || t.sub || c.name, catName: t.sub ? `${c.name} (${t.sub})` : c.name, accText: acc(t.account).name,
    amount: (inc ? '+' : '−') + money(t.amount).replace('−', ''), cls: inc ? 'text-income' : '' };
}
function txRow(t) {
  const v = txView(t);
  return `<tr>
    <td class="num text-sm text-muted whitespace-nowrap">${thDate(t.date)}</td>
    <td><div class="flex items-center gap-3 min-w-0">${catIcon(v.c)}<div class="min-w-0"><p class="truncate max-w-[22rem]">${esc(v.title)}${attachLink(t)}</p><p class="sub truncate">${esc(v.catName)}${t.recurringId ? ' (ประจำ)' : ''}</p></div></div></td>
    <td class="text-sm text-muted whitespace-nowrap">${esc(v.accText)}</td>
    <td class="r num font-medium whitespace-nowrap ${v.cls}">${v.amount}</td>
    <td class="r no-print whitespace-nowrap">
      <button class="icon-btn inline-grid" data-edit-tx="${esc(t.id)}" aria-label="แก้ไข"><i data-lucide="pencil"></i></button>
      <button class="icon-btn inline-grid" data-del-tx="${esc(t.id)}" aria-label="ลบ"><i data-lucide="trash-2"></i></button>
    </td></tr>`;
}
function txItem(t) {
  const v = txView(t);
  return `<button class="w-full flex items-center gap-3 py-3 text-left" data-edit-tx="${esc(t.id)}">
    ${catIcon(v.c)}
    <span class="min-w-0 flex-1"><span class="block truncate">${esc(v.title)}</span><span class="sub block truncate">${esc(v.catName)}, ${esc(v.accText)}</span></span>
    <span class="num font-medium whitespace-nowrap ${v.cls}">${v.amount}${t.attachment ? ' <i data-lucide="paperclip" class="inline !w-3 !h-3 text-muted"></i>' : ''}</span>
  </button>`;
}
function txListMobile(list) {
  const groups = {};
  list.forEach((t) => (groups[t.date] = groups[t.date] || []).push(t));
  return Object.keys(groups).sort().reverse().map((d) => {
    const net = groups[d].reduce((s, t) => s + (t.type === 'income' ? t.amount : t.type === 'expense' ? -t.amount : 0), 0);
    return `<div class="pt-3"><div class="flex justify-between text-xs text-muted pb-1 border-b border-rule"><span>${thDate(d)}</span><span class="num">${money(net, { sign: true })}</span></div>
      <div class="divide-y divide-rule/70">${groups[d].map(txItem).join('')}</div></div>`;
  }).join('');
}

/* =====================================================================
 * View: Overview
 * =================================================================== */
function renderOverview() {
  const P = period();
  const cur = summarize(inRange(P.from, P.to));
  const prev = summarize(inRange(P.prevFrom, P.prevTo));
  const insights = buildInsights(P, cur, prev);
  const netWorth = Object.keys(S.balances).reduce((s, k) => s + (S.balances[k] || 0), 0);
  const recent = inRange('0000-01-01', S.today).sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt)).slice(0, 6);
  const topCats = activeCats('expense').map((c) => [c, cur.byCat[c.id] || 0]).filter((x) => x[1] > 0).sort((a, b) => b[1] - a[1]);

  const kpi = (label, val, chip, extra = '') => `
    <div class="px-5 py-4 min-w-0">
      <p class="sub">${label}</p>

/** แถบจัดสรรรายได้: จำเป็น / ตามใจ / เหลือเก็บ เทียบเกณฑ์ 50/30/20 */
function allocationPanel(cur, P) {
  if (cur.income <= 0) {
    return `<div class="panel"><div class="panel-h"><h2>การจัดสรรรายได้</h2></div><div class="panel-b sub">บันทึกรายรับในช่วงนี้เพื่อดูว่าเงินแต่ละบาทถูกใช้ไปกับอะไร</div></div>`;
  }
  const scale = Math.max(cur.income, cur.expense);
  const w = (v) => (Math.max(0, v) / scale * 100).toFixed(2) + '%';
  const saved = Math.max(0, cur.net), over = Math.max(0, -cur.net);
  const lbl = (v) => (v / scale > 0.09 ? pct(v / cur.income) : '');
  const markPos = (r) => (cur.income * r / scale * 100).toFixed(2) + '%';
  const row = (color, name, v, target, note) => `
    <div class="flex items-start gap-3">
      <span class="w-3 h-3 rounded-sm mt-1.5 shrink-0" style="background:${color}"></span>
      <div class="flex-1 min-w-0"><p class="font-medium">${name}</p><p class="sub">${note}</p></div>
      <div class="text-right"><p class="num font-semibold">${money(v)}</p><p class="num sub">${pct(v / cur.income)} <span class="text-xs">(เป้า ${target})</span></p></div>
    </div>`;
  return `
  <div class="panel">
    <div class="panel-h"><h2>เงินรายรับถูกใช้ไปอย่างไร</h2><span class="sub ml-auto hidden sm:inline">เทียบเกณฑ์ 50/30/20</span></div>
    <div class="panel-b">
      <div class="alloc" role="img" aria-label="จำเป็น ${pct(cur.need / cur.income)} ตามใจ ${pct(cur.want / cur.income)} เหลือเก็บ ${pct(saved / cur.income)}">
        ${cur.need > 0 ? `<div style="width:${w(cur.need)};background:rgb(var(--need))">${lbl(cur.need)}</div>` : ''}
        ${cur.want > 0 ? `<div style="width:${w(cur.want)};background:rgb(var(--want))">${lbl(cur.want)}</div>` : ''}
        ${saved > 0 ? `<div style="width:${w(saved)};background:rgb(var(--income))">${lbl(saved)}</div>` : ''}
      </div>
      <div class="alloc-marks" aria-hidden="true">
        <span style="left:${markPos(0.5)}">50%</span><span style="left:${markPos(0.8)}">80%</span>${over > 0 ? `<span style="left:${markPos(1)}">รายรับ</span>` : ''}
      </div>
      <div class="grid md:grid-cols-3 gap-4 mt-3">
        ${row('rgb(var(--need))', 'จำเป็น', cur.need, '≤ 50%', 'ที่พัก อาหาร เดินทาง บิล สุขภาพ')}
        ${row('rgb(var(--want))', 'ตามใจ', cur.want, '≤ 30%', 'ช้อปปิ้ง บันเทิง และอื่นๆ')}
        ${over > 0 ? row('rgb(var(--expense))', 'ใช้เกินรายรับ', over, '0%', 'ส่วนที่ใช้เงินเก็บหรือเครดิต')
          : row('rgb(var(--income))', 'เหลือเก็บ', saved, '≥ 20%', 'เงินออมและลงทุน')}
      </div>
    </div>
  </div>`;
}

function budgetRows(cur, P, limit) {
  const nM = P.months.length;
  const rows = activeCats('expense').filter((c) => c.monthlyBudget > 0)
    .map((c) => ({ c, spent: cur.byCat[c.id] || 0, budget: c.monthlyBudget * nM }))
    .sort((a, b) => b.spent / b.budget - a.spent / a.budget).slice(0, limit || 99);
  if (!rows.length) return '';
  return rows.map(({ c, spent, budget }) => {
    const r = spent / budget;
    const color = r > 1 ? 'rgb(var(--expense))' : r >= 0.8 ? 'rgb(var(--warn))' : c.color;
    return `<div class="py-2.5">
      <div class="flex items-center gap-2 text-sm mb-1.5"><span class="flex-1 truncate">${esc(c.name)}</span>
        <span class="num ${r > 1 ? 'text-expense font-medium' : 'text-muted'}">${money(spent)} / ${money(budget)}</span></div>
      <div class="bar"><span style="width:${Math.min(100, r * 100).toFixed(1)}%;background:${color}"></span></div>
    </div>`;
  }).join('');
}

          <p class="sub text-xs pt-1">หมวดแต่ละหมวดเป็น "จำเป็น" หรือ "ตามใจ" ตั้งได้ในหน้าตั้งค่า</p>

      <div class="scroll-x">

          <thead><tr><th>หมวด</th><th class="r">จำนวนเงิน</th><th class="r">% ของรายจ่าย</th><th class="r">% ของรายรับ</th><th class="r">เทียบช่วงก่อน</th><th class="r">เฉลี่ย 3 เดือนก่อน</th><th>คำแนะนำ</th></tr></thead>

function ruleRow(name, v, income, target, color, kind) {
  const r = income > 0 ? v / income : 0;
  const ok = kind === 'max' ? r <= target : r >= target;
  return `<div>
    <div class="flex items-baseline gap-2 text-sm mb-1.5"><span class="font-medium">${name}</span><span class="sub">เป้า ${kind === 'max' ? '≤' : '≥'} ${pct(target)}</span>
      <span class="ml-auto num font-semibold ${ok ? '' : 'text-expense'}">${income > 0 ? pct(r, 1) : '–'}</span></div>
    <div class="bar relative"><span style="width:${Math.min(100, r * 100).toFixed(1)}%;background:rgb(var(--${color}))"></span>
      <i class="absolute top-[-3px] h-[14px] border-l-2 border-ink/60" style="left:${target * 100}%"></i></div>
    <p class="sub text-xs mt-1">${income > 0 ? (ok ? 'อยู่ในเกณฑ์' : (kind === 'max' ? `เกินเกณฑ์ ${money(v - income * target)}` : `ขาดอีก ${money(income * target - v)}`)) : ''}</p>
  </div>`;
}

function renderCatDeep() {
  const box = $('#catDeep');
  if (!box) return;
  const P = period();
  const nM = P.months.length;
  const c = cat(S.focusCat);
  const list = inRange(P.from, P.to).filter((t) => t.category === c.id);
  const cur = summarize(inRange(P.from, P.to));
  const amt = list.reduce((s, t) => s + t.amount, 0);
  const prevAmt = inRange(P.prevFrom, P.prevTo).filter((t) => t.category === c.id).reduce((s, t) => s + t.amount, 0);
  const avg3 = monthlyAvg(c.id, P.months[0], 3);
  const months12 = []; for (let i = 11; i >= 0; i--) months12.push(addMonths(P.endMonth, -i));
  const vals12 = months12.map((m) => ((S.monthly[m] || {}).byCat || {})[c.id] || 0);
  const withData = months12.filter((m) => S.monthly[m]).length || 1;
  const avg12 = Math.round(vals12.reduce((a, b) => a + b, 0) / withData);
  const maxI = vals12.indexOf(Math.max(...vals12));
  const biggest = list.slice().sort((a, b) => b.amount - a.amount)[0];
  const byNote = {};
  list.forEach((t) => { const k = (t.note || '(ไม่มีหมายเหตุ)').trim(); byNote[k] = byNote[k] || { n: 0, v: 0 }; byNote[k].n++; byNote[k].v += t.amount; });
  const topNotes = Object.entries(byNote).sort((a, b) => b[1].v - a[1].v).slice(0, 5);
  const adv = categoryAdvice(c, amt / nM, avg3, cur.income / nM);
  const target = c.monthlyBudget > 0 ? c.monthlyBudget : (avg12 > 0 ? Math.min(avg12, amt / nM) : 0);
  const recommend = (() => {
    if (!amt) return 'ไม่มีรายจ่ายในหมวดนี้ช่วงนี้';
    const per = amt / nM;
    if (c.monthlyBudget > 0 && per > c.monthlyBudget) return `ใช้เกินงบ ${money(per - c.monthlyBudget)} ต่อเดือน รายการที่ใช้มากที่สุดคือ "${topNotes[0][0]}" ลองเริ่มลดจากรายการนี้`;
    if (avg3 && per - avg3 > Math.max(300, avg3 * 0.2)) return `สูงกว่าค่าเฉลี่ย 3 เดือน ${money(per - avg3)} ต่อเดือน ถ้าคุมให้อยู่ราว ${money(avg3)} ต่อเดือน จะประหยัดได้ปีละ ${money((per - avg3) * 12)}`;
    if (c.group === 'want' && cur.income > 0 && amt / cur.income > 0.12) return `หมวดนี้กินสัดส่วน ${pct(amt / cur.income)} ของรายรับ ถ้าตั้งงบไว้ที่ 10% (${money(cur.income / nM * 0.1)} ต่อเดือน) จะออมเพิ่มได้ ${money(amt / nM - cur.income / nM * 0.1)} ต่อเดือน`;
    if (!c.monthlyBudget) return `ใช้จ่ายสม่ำเสมอ แนะนำตั้งงบที่ประมาณ ${money(Math.ceil(Math.max(avg12, per) * 1.05 / 100) * 100)} ต่อเดือนเพื่อติดตามได้ง่ายขึ้น`;
    return 'อยู่ในงบและใกล้เคียงค่าเฉลี่ย รักษาระดับนี้ไว้';
  })();

  const stat = (label, val, sub) => `<div class="py-3 sm:py-0 sm:px-4 first:pl-0"><p class="sub text-xs">${label}</p><p class="num font-semibold text-lg mt-0.5">${val}</p>${sub ? `<p class="sub text-xs">${sub}</p>` : ''}</div>`;
  box.innerHTML = `
    <div class="panel-h flex-wrap">
      <h2>วิเคราะห์รายหมวด</h2>
      <label class="ml-auto no-print"><span class="sr-only">เลือกหมวด</span>

/** แยกยอดตามหมวดย่อย เช่น มื้ออาหาร */
function subBreakdown(catId, list) {
  const total = list.reduce((s, t) => s + t.amount, 0);
  if (!total) return '';
  const names = SUBCATS[catId].concat(['ไม่ระบุ']);
  const rows = names.map((n) => {
    const items = list.filter((t) => (t.sub || 'ไม่ระบุ') === n);
    const v = items.reduce((s, t) => s + t.amount, 0);
    return { n, v, cnt: items.length };
  }).filter((r) => r.cnt);
  return `<div><p class="text-sm font-medium mb-1">แยกตามมื้อ</p>${rows.map((r) => `
    <div class="py-1.5"><div class="flex items-center gap-2 text-sm"><span class="flex-1">${esc(r.n)}</span><span class="sub text-xs">${r.cnt} ครั้ง, เฉลี่ย ${money(Math.round(r.v / r.cnt))}</span><span class="num w-20 text-right">${money(r.v)}</span></div>
    <div class="bar mt-1 !h-1.5"><span style="width:${(r.v / total * 100).toFixed(1)}%;background:${cat(catId).color}"></span></div></div>`).join('')}</div>`;
}

function matrixData(endMonth, n) {
  const months = []; for (let i = n - 1; i >= 0; i--) months.push(addMonths(endMonth, -i));
  const get = (m) => S.monthly[m] || { income: 0, expense: 0, byCat: {} };
  const cats = S.categories.filter((c) => c.type === 'expense' && (!c.archived || months.some((m) => get(m).byCat[c.id])))
    .sort((a, b) => (a.group === b.group ? a.sortOrder - b.sortOrder : a.group === 'need' ? -1 : 1));
  return { months, get, cats };
}

function matrixTable(endMonth, n) {
  const { months, get, cats } = matrixData(endMonth, n);
  const has = months.some((m) => S.monthly[m]);
  if (!has) return emptyState('table', 'ยังไม่มีข้อมูลในช่วงนี้');
  const cell = (v, max, color) => {
    const a = max > 0 && v > 0 ? 0.06 + (v / max) * 0.3 : 0;
    return `<td class="num" style="${a ? `background:${tint(color, a)}` : ''}">${v ? money(v) : '<span class="text-muted">–</span>'}</td>`;
  };
  const tail = (vals, goodUp) => {
    const nz = vals.filter((v) => v !== 0);
    const avg = Math.round(vals.reduce((a, b) => a + b, 0) / Math.max(1, months.filter((m) => S.monthly[m]).length));
    const last = vals[vals.length - 1], prev = vals[vals.length - 2];
    return `<td class="num text-muted">${nz.length ? money(avg) : '–'}</td><td>${last || prev ? deltaChip(last, prev, goodUp) : ''}</td>`;
  };
  const row = (label, vals, opts = {}) => {
    const max = Math.max(...vals);
    return `<tr class="${opts.cls || ''}"><td class="stick">${label}</td>${vals.map((v) => opts.plain ? `<td class="num ${v < 0 ? 'text-expense' : ''}">${opts.fmt ? opts.fmt(v) : money(v)}</td>` : cell(v, max, opts.color)).join('')}${opts.noTail ? '<td></td><td></td>' : tail(vals, opts.goodUp)}</tr>`;
  };
  const inc = months.map((m) => get(m).income), exp = months.map((m) => get(m).expense);
  const net = inc.map((v, i) => v - exp[i]);
  const rate = inc.map((v, i) => (v > 0 ? net[i] / v : null));
  let lastGroup = '';
  const catRows = cats.map((c) => {
    let head = '';
    if (c.group !== lastGroup) { lastGroup = c.group; head = `<tr class="group"><td class="stick" colspan="1">${c.group === 'need' ? 'ค่าใช้จ่ายจำเป็น' : 'ค่าใช้จ่ายตามใจ'}</td><td colspan="${months.length + 2}"></td></tr>`; }
    return head + row(`<span class="inline-flex items-center gap-2"><span class="w-2 h-2 rounded-full" style="background:${c.color}"></span>${esc(c.name)}</span>`, months.map((m) => get(m).byCat[c.id] || 0), { color: c.color, goodUp: false });
  }).join('');
  return `<table class="matrix text-sm">
    <thead><tr><th class="stick">หมวด</th>${months.map((m) => `<th>${thMonth(m, true)}</th>`).join('')}<th>เฉลี่ย</th><th>ล่าสุด</th></tr></thead>
    <tbody>
      ${row('<span class="font-medium">รายรับรวม</span>', inc, { color: '#0E7C66', goodUp: true })}
      ${catRows}
      ${row('รวมรายจ่าย', exp, { cls: 'total', plain: true, goodUp: false })}
      ${row('คงเหลือสุทธิ', net, { cls: 'total', plain: true, goodUp: true })}
      ${row('อัตราการออม', rate.map((v) => v == null ? 0 : v), { plain: true, fmt: (v) => pct(v, 0), noTail: true })}
    </tbody></table>`;
}

function matrixCsv() {
  const P = period();
  const { months, get, cats } = matrixData(P.endMonth, S.matrixMonths);
  const rows = [['หมวด', ...months.map((m) => thMonth(m, true))]];
  rows.push(['รายรับรวม', ...months.map((m) => r2(get(m).income))]);
  cats.forEach((c) => rows.push([c.name, ...months.map((m) => r2(get(m).byCat[c.id] || 0))]));
  rows.push(['รวมรายจ่าย', ...months.map((m) => r2(get(m).expense))]);
  rows.push(['คงเหลือสุทธิ', ...months.map((m) => r2(get(m).income - get(m).expense))]);
  downloadCsv(rows, `moneypro-monthly-${P.endMonth}.csv`);
}

function downloadCsv(rows, name) {
  const csv = '\uFEFF' + rows.map((r) => r.map((v) => {
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportTxCsv() {
  const rows = [['วันที่', 'ประเภท', 'หมวดหมู่', 'หมวดย่อย', 'บัญชี', 'ไปยังบัญชี', 'จำนวนเงิน', 'หมายเหตุ', 'ไฟล์แนบ']];
  const typeName = { income: 'รายรับ', expense: 'รายจ่าย', transfer: 'โอน' };
  filteredTx().slice().reverse().forEach((t) => rows.push([t.date, typeName[t.type], t.type === 'transfer' ? '' : cat(t.category).name, t.sub || '', acc(t.account).name,
    t.type === 'transfer' ? acc(t.toAccount).name : '', t.type === 'expense' ? -t.amount : t.amount, t.note, t.attachment ? driveUrl(t.attachment) : '']));
  const P = period();
  downloadCsv(rows, `moneypro-${P.from}_${P.to}.csv`);
  toast('ดาวน์โหลด CSV แล้ว');
}

function nextRun(r) {
  const after = r.lastRun || addDays(r.startDate, -1);
  let y = +after.slice(0, 4), m = +after.slice(5, 7);
  for (let i = 0; i < 3; i++) {
    const c = y + '-' + pad2(m) + '-' + pad2(Math.min(r.dayOfMonth, new Date(y, m, 0).getDate()));
    if (c > after) return c;
    if (++m > 12) { m = 1; y++; }
  }
  return '';
}

 * View: Savings

const savingAccounts = () => S.accounts.filter((a) => SAVING_TYPES.includes(a.type) && (!a.archived || S.balances[a.id]));
const totalSavings = () => savingAccounts().reduce((s, a) => s + (S.balances[a.id] || 0), 0);
/** ยอดเงินออม ณ สิ้นแต่ละเดือน (ย้อนหลังจากยอดปัจจุบัน) */
function savingsHistory(months) {
  const ids = new Set(savingAccounts().map((a) => a.id));
  const delta = {};
  S.tx.forEach((t) => {
    if (t.date > S.today) return;
    const k = monthOf(t.date);
    let d = 0;
    if (t.type === 'transfer') d = (ids.has(t.toAccount) ? t.amount : 0) - (ids.has(t.account) ? t.amount : 0);
    else if (ids.has(t.account)) d = t.type === 'income' ? t.amount : -t.amount;
    if (d) delta[k] = (delta[k] || 0) + d;
  });
  let bal = totalSavings();
  const cur = monthOf(S.today);
  const out = {};
  for (let m = cur; m >= months[0]; m = addMonths(m, -1)) {
    out[m] = bal;
    bal -= delta[m] || 0;
  }
  return months.map((m) => ({ month: m, balance: r2(out[m] ?? 0), added: r2(delta[m] || 0) }));
}
function goalProgress(g) {
  const current = g.account ? (S.balances[g.account] || 0) : totalSavings();
  const left = Math.max(0, g.targetAmount - current);
  let perMonth = null, monthsLeft = null;
  if (g.targetDate && left > 0) {
    monthsLeft = Math.max(1, (+g.targetDate.slice(0, 4) - +S.today.slice(0, 4)) * 12 + (+g.targetDate.slice(5, 7) - +S.today.slice(5, 7)));
    perMonth = left / monthsLeft;
  }
  return { current, left, pct: g.targetAmount ? Math.min(1, Math.max(0, current / g.targetAmount)) : 0, perMonth, monthsLeft };
}

  const avgAdd = last3.length ? last3.reduce((a, b) => a + b, 0) / last3.length : 0;

let modalCleanup = null;
function openModal(html, onMount) {
  closeModal();
  $('#modalRoot').innerHTML = `<div class="modal-back" data-close></div><div class="modal modal-c" role="dialog" aria-modal="true">${html}</div>`;
  document.body.style.overflow = 'hidden';
  icons();
  if (onMount) modalCleanup = onMount($('#modalRoot .modal')) || null;
  const first = $('#modalRoot .modal [autofocus]') || $('#modalRoot .modal input, #modalRoot .modal select');
  if (first && window.matchMedia('(min-width: 640px)').matches) setTimeout(() => first.focus(), 50);
}
function closeModal() {
  if (typeof modalCleanup === 'function') { try { modalCleanup(); } catch (e) {} }
  modalCleanup = null;
  $('#modalRoot').innerHTML = '';
  document.body.style.overflow = '';
}
const modalHead = (title, sub) => `<div class="mh flex items-start gap-3 px-5 pt-5 pb-3 border-b border-rule"><div class="flex-1"><h3 class="font-semibold text-lg">${title}</h3>${sub ? `<p class="sub">${sub}</p>` : ''}</div><button class="icon-btn" data-close aria-label="ปิด"><i data-lucide="x"></i></button></div>`;
const modalFoot = (left, right) => `<div class="mf flex items-center gap-2 px-5 py-4 border-t border-rule sticky bottom-0 bg-surface">${left || ''}<div class="ml-auto flex gap-2">${right}</div></div>`;

function confirmDialog(title, text, okLabel = 'ลบ') {
  return new Promise((resolve) => {
    openModal(`${modalHead(title)}<div class="px-5 py-4"><p>${text}</p></div>${modalFoot('', `<button class="btn btn-ghost" data-close>ยกเลิก</button><button class="btn btn-danger" id="cfOk">${okLabel}</button>`)}`, (m) => {
      $('#cfOk', m).onclick = () => { resolve(true); closeModal(); };
      return () => resolve(false);
    });
  });
}

/** บัญชีหลักสำหรับโอนออก: บัญชีธนาคารก่อน แล้วค่อยบัญชีอื่นที่ไม่ใช่บัญชีออม */

const accOptions = (selected) => activeAccounts().map((a) => `<option value="${a.id}" ${a.id === selected ? 'selected' : ''}>${esc(a.name)}</option>`).join('');

    };
    $$('[data-txtype]', m).forEach((b) => b.onclick = () => setType(b.dataset.txtype));
    const syncSub = (time) => {
      const cid = $('#tCat', m).value, has = !!SUBCATS[cid] && st.type !== 'transfer';
      $('#tSubWrap', m).classList.toggle('hidden', !has);
      if (has && (time || !$('#tSub', m).value || !SUBCATS[cid].includes($('#tSub', m).value))) {
        $('#tSub', m).innerHTML = subOptions(cid, mealByTime(time || nowHHMM()));
      }
    };
    $('#tCat', m).addEventListener('change', () => syncSub());

    // ---- Receipt upload ----
    const show = (which) => ['rcptEmpty', 'rcptBusy', 'rcptDone'].forEach((id) => $('#' + id, m).classList.toggle('hidden', id !== which));
    const mark = (el) => { el.classList.add('autofilled'); el.addEventListener('input', () => el.classList.remove('autofilled'), { once: true }); };
    async function handleFile(file) {
      if (!file) return;
      if (!/^image\/|^application\/pdf$/.test(file.type)) { toast('รองรับเฉพาะรูปภาพหรือ PDF', 'error'); return; }
      const busy = (t) => { $('#rcptBusyText', m).textContent = t; };
      show('rcptBusy'); busy('กำลังเตรียมรูป');
      try {
        const prepared = await prepareImage(file);
        if (prepared.preview) { $('#rcptThumb', m).src = prepared.preview; $('#rcptThumb', m).classList.remove('hidden'); $('#rcptIcon', m).classList.add('hidden'); }
        else { $('#rcptThumb', m).classList.add('hidden'); $('#rcptIcon', m).classList.remove('hidden'); }

        // อัปโหลดเก็บใน Drive และอ่านข้อความในเบราว์เซอร์ไปพร้อมกัน
        const upload = api('uploadReceipt', { data: prepared.base64, mimeType: prepared.mime, name: file.name })
          .then((r) => ({ ok: true, r }), (e) => ({ ok: false, e }));
        let text = '', ocrError = '';
        if (prepared.mime === 'application/pdf') {
          ocrError = 'อ่านอัตโนมัติได้เฉพาะรูปภาพ ไฟล์ PDF แนบไว้ให้แล้ว';
        } else {
          try {
            text = await ocrImage(prepared.ocr || prepared.preview, (pct) => busy(pct == null ? 'กำลังโหลดตัวอ่านภาษาไทย (ครั้งแรกเท่านั้น)' : `กำลังอ่านข้อความ ${pct}%`));
          } catch (e) { ocrError = 'อ่านข้อความไม่สำเร็จ: ' + e.message; }
        }
        busy('กำลังบันทึกรูป');
        const up = await upload;
        if (!up.ok) throw up.e;
        const res = up.r;
        if (st.uploadedNew) api('discardReceipt', st.uploadedNew).catch(() => {});
        st.attachment = res.fileId; st.uploadedNew = res.fileId;

        let p = {};
        if (text.trim()) { busy('กำลังแยกข้อมูล'); try { p = await api('parseReceipt', text); } catch (e) { ocrError = e.message; } }
        const filled = [];
        if (p.type && p.type !== st.type) setType(p.type);
        if (p.amount) { $('#tAmount', m).value = p.amount; mark($('#tAmount', m)); filled.push('ยอดเงิน'); }
        if (p.date) { $('#tDate', m).value = p.date; mark($('#tDate', m)); filled.push('วันที่'); }
        if (p.category && S.catById[p.category] && S.catById[p.category].type === st.type) { $('#tCat', m).value = p.category; mark($('#tCat', m)); filled.push('หมวด'); }
        if (SUBCATS[$('#tCat', m).value]) { syncSub(p.time || ''); if (p.time) mark($('#tSub', m)); }
        if (p.merchant && !$('#tNote', m).value) { $('#tNote', m).value = p.merchant; mark($('#tNote', m)); filled.push('ร้านค้า'); }
        $('#rcptTitle', m).textContent = filled.length ? `อ่านได้: ${filled.join(', ')}` : (ocrError ? 'แนบไฟล์แล้ว' : 'แนบรูปแล้ว ไม่พบข้อมูลที่อ่านได้');
        $('#rcptSub', m).textContent = ocrError || (filled.length ? 'ตรวจสอบช่องที่ไฮไลต์ก่อนบันทึก' : 'กรอกข้อมูลเองได้เลย');
        if (text) { $('#rcptText', m).textContent = text; $('#rcptTextBox', m).classList.remove('hidden'); }
        show('rcptDone');
      } catch (e) {
        show(st.attachment ? 'rcptDone' : 'rcptEmpty');
        toast(e.message, 'error');
      }
    }
    $('#rcptFile', m).onchange = (e) => handleFile(e.target.files[0]);
    const dz = $('#dropZone', m);
    dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('over'));
    dz.addEventListener('drop', (e) => { e.preventDefault(); dz.classList.remove('over'); handleFile(e.dataTransfer.files[0]); });
    $('#rcptRemove', m).onclick = () => {
      if (st.uploadedNew) api('discardReceipt', st.uploadedNew).catch(() => {});
      st.attachment = ''; st.uploadedNew = '';
      $('#rcptFile', m).value = '';
      $('#rcptTextBox', m).classList.add('hidden');
      show('rcptEmpty');
    };

    // ---- Save / delete ----
    let saved = false;
    $('#txSave', m).onclick = async () => {
      const data = {
        id: t && t.id, type: st.type, amount: parseFloat($('#tAmount', m).value), date: $('#tDate', m).value,
        category: st.type === 'transfer' ? '' : $('#tCat', m).value, account: $('#tAcc', m).value,
        toAccount: st.type === 'transfer' ? $('#tTo', m).value : '', note: $('#tNote', m).value.trim(), attachment: st.attachment,
        sub: st.type !== 'transfer' && SUBCATS[$('#tCat', m).value] ? $('#tSub', m).value : '',
      };
      const err = !(data.amount > 0) ? 'กรอกจำนวนเงินที่มากกว่า 0' : !data.date ? 'เลือกวันที่'
        : st.type !== 'transfer' && !data.category ? 'เลือกหมวดหมู่' : !data.account ? 'เลือกบัญชี'
        : st.type === 'transfer' && data.toAccount === data.account ? 'เลือกบัญชีปลายทางที่ไม่ใช่บัญชีเดียวกัน' : '';
      if (err) { $('#txErr', m).textContent = err; $('#txErr', m).classList.remove('hidden'); return; }
      const btn = $('#txSave', m); btn.disabled = true; btn.textContent = 'กำลังบันทึก';
      try {
        await api(isEdit ? 'updateTransaction' : 'addTransaction', data);
        saved = true;
        closeModal();
        toast(isEdit ? 'บันทึกการแก้ไขแล้ว' : 'บันทึกรายการแล้ว');
        await refresh();
      } catch (e) {
        $('#txErr', m).textContent = e.message; $('#txErr', m).classList.remove('hidden');
        btn.disabled = false; btn.textContent = isEdit ? 'บันทึกการแก้ไข' : 'บันทึกรายการ';
      }
    };
    if (isEdit) $('#txDel', m).onclick = async () => { saved = true; closeModal(); await deleteTx(t.id); };
    return () => { if (!saved && st.uploadedNew) api('discardReceipt', st.uploadedNew).catch(() => {}); };
  });
}

/* ---------- OCR ในเบราว์เซอร์ (Tesseract.js, ภาษาไทย + อังกฤษ) ---------- */
// Apps Script ตัดข้อความหลังเครื่องหมายทับสองตัวในสคริปต์ จึงต่อ URL ด้วย join
const TESS_URL = ['https:', '', 'cdn.jsdelivr.net', 'npm', 'tesseract.js@5.1.1', 'dist', 'tesseract.min.js'].join('/');
const OCR = { worker: null, loading: null, onProgress: null };
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src; el.onload = resolve; el.onerror = () => reject(new Error('โหลดตัวอ่านข้อความไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต'));
    document.head.appendChild(el);
  });
}
async function getOcrWorker() {
  if (OCR.worker) return OCR.worker;
  if (!OCR.loading) {
    OCR.loading = (async () => {
      if (!window.Tesseract) await loadScript(TESS_URL);
      OCR.worker = await Tesseract.createWorker(['tha', 'eng'], 1, {
        logger: (msg) => { if (OCR.onProgress && msg.status === 'recognizing text') OCR.onProgress(Math.round(msg.progress * 100)); },
      });
      return OCR.worker;
    })().catch((e) => { OCR.loading = null; throw e; });
  }
  return OCR.loading;
}
/** อ่านข้อความจากรูป (dataURL) คืนค่าเป็นข้อความ จำกัดเวลา 90 วินาที */
async function ocrImage(dataUrl, onProgress) {
  OCR.onProgress = onProgress;
  if (!OCR.worker) onProgress(null);
  const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('ใช้เวลานานเกินไป')), 90000));
  try {
    const worker = await Promise.race([getOcrWorker(), timeout]);
    onProgress(0);
    const res = await Promise.race([worker.recognize(dataUrl), timeout]);
    return (res && res.data && res.data.text) || '';
  } finally {
    OCR.onProgress = null;
  }
}

/** ย่อรูปให้ด้านยาวไม่เกิน 2000px (คมพอสำหรับ OCR) แล้วแปลงเป็น base64 */
function prepareImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    reader.onload = () => {
      const dataUrl = reader.result;
      if (file.type === 'application/pdf' || file.type === 'image/gif') {
        resolve({ base64: dataUrl.split(',')[1], mime: file.type, preview: file.type === 'image/gif' ? dataUrl : '' });
        return;
      }
      const img = new Image();
      img.onload = () => {
        const max = 2000, scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        const out = c.toDataURL('image/jpeg', 0.88);
        // สำเนาสำหรับ OCR: ไม่บีบอัด และขยายรูปเล็กให้กว้างอย่างน้อย 1400px อ่านภาษาไทยได้แม่นขึ้น
        const os = Math.min(2400 / Math.max(img.width, img.height), Math.max(1, 1400 / img.width));
        const oc = document.createElement('canvas');
        oc.width = Math.round(img.width * os); oc.height = Math.round(img.height * os);
        const octx = oc.getContext('2d');
        octx.fillStyle = '#fff'; octx.fillRect(0, 0, oc.width, oc.height);
        octx.imageSmoothingQuality = 'high';
        octx.drawImage(img, 0, 0, oc.width, oc.height);
        resolve({ base64: out.split(',')[1], mime: 'image/jpeg', preview: out, ocr: oc.toDataURL('image/png') });
      };
      img.onerror = () => reject(new Error('เปิดรูปนี้ไม่ได้ (ถ้าเป็นไฟล์ HEIC ลองถ่ายหน้าจอหรือแปลงเป็น JPG)'));
      img.src = dataUrl;
    };
    reader.readAsDataURL(file);
  });
}

async function deleteTx(id) {
  const t = S.tx.find((x) => x.id === id);
  if (!t) return;
  const ok = await confirmDialog('ลบรายการนี้?', `${esc(txView(t).title)} ${money(t.amount)} วันที่ ${thDate(t.date, true)}${t.attachment ? ' รวมถึงไฟล์สลิปที่แนบไว้' : ''} จะถูกลบถาวร`);
  if (!ok) return;
  try { await api('deleteTransaction', id); toast('ลบรายการแล้ว'); await refresh(); } catch (e) { toast(e.message, 'error'); }
}

/* =====================================================================
 * Routing, rendering & events
 * =================================================================== */
const RENDER = { overview: renderOverview, analysis: renderAnalysis, transactions: renderTransactions, budgets: renderBudgets, savings: renderSavings, recurring: renderRecurring, settings: renderSettings };

function render() {
  const v = S.view;
  $('#viewTitle').textContent = VIEWS[v].title;
  document.title = VIEWS[v].title + ' – MoneyPro';
  $$('.view').forEach((el) => el.classList.toggle('hidden', el.id !== 'view-' + v));
  $$('[data-nav]').forEach((a) => a.dataset.nav === v ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  $$('.tab-link').forEach((a) => {
    const on = a.dataset.tab === v || (a.dataset.tab === 'more' && ['savings', 'budgets', 'recurring', 'settings'].includes(v));
    on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
  });
  $('#periodSel').disabled = v === 'recurring' || v === 'settings';
  const netWorth = Object.keys(S.balances).reduce((s, k) => s + (S.balances[k] || 0), 0);
  $('#sideNetWorth').textContent = money(netWorth);
  RENDER[v]();
  icons();
}

/** เปลี่ยนหน้าภายในแอป (ไม่ใช้ลิงก์ # เพราะใน Apps Script ลิงก์จะพาออกนอกแอป) */
function go(v) {
  if (!VIEWS[v]) v = 'overview';
  if (v !== S.view && window.google && google.script && google.script.history) {
    try { google.script.history.push({ view: v }, {}, v); } catch (e) {}
  }
  S.view = v;
  route();
}

function route() {
  closeModal();
  render();
  window.scrollTo(0, 0);
}

async function refresh() {
  const d = await api('bootstrap');
  apply(d);
  render();
}
function apply(d) {
  S.today = d.today || S.today;
  S.accounts = d.accounts || []; S.categories = d.categories || []; S.recurring = d.recurring || []; S.goals = d.goals || [];
  S.settings = d.settings || {}; S.tx = d.transactions || []; S.balances = d.balances || {};
  indexData();
}

function localStore(k, v) {
  try { if (v === undefined) return localStorage.getItem('mp_' + k); localStorage.setItem('mp_' + k, v); } catch (e) { return null; }
}
function applyTheme() {
  const t = localStore('theme') || 'system';
  const dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', dark);
}

function bind() {
  if (IS_GAS && google.script.history) {
    google.script.history.setChangeHandler((e) => { const v = (e.state && e.state.view) || e.location.hash || 'overview'; S.view = VIEWS[v] ? v : 'overview'; route(); });
  }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyTheme(); render(); });

  $('#periodSel').addEventListener('change', (e) => {
    S.periodKey = e.target.value;
    $('#customRange').classList.toggle('hidden', S.periodKey !== 'custom');
    if (S.periodKey === 'custom') {
      const P = period();
      $('#rangeFrom').value = P.from; $('#rangeTo').value = P.to;
    }
    S.page = 1;
    render();
  });
  $('#rangeApply').addEventListener('click', () => { S.custom = { from: $('#rangeFrom').value, to: $('#rangeTo').value }; S.page = 1; render(); });
  $('#addBtn').addEventListener('click', () => openTxForm());

  document.addEventListener('click', async (e) => {
    const el = (sel) => e.target.closest(sel);
    if (el('[data-close]')) { closeModal(); return; }
    const g = el('[data-go]');
    if (g) { go(g.dataset.go); return; }
    const act = el('[data-action]');
    if (act) {
      const a = act.dataset.action;
      if (a === 'add') openTxForm();
      else if (a === 'more') openMoreSheet();
      else if (a === 'print') window.print();
      else if (a === 'csv') exportTxCsv();
      else if (a === 'matrix-csv') matrixCsv();
      else if (a === 'add-rec') openRecForm();
      else if (a === 'add-acc') openAccForm();
      else if (a === 'add-cat') openCatForm();
      else if (a === 'add-goal') openGoalForm();
      else if (a === 'add-saving-acc') openAccForm(null, { type: 'saving', name: 'บัญชีออมทรัพย์', color: '#0EA5E9' });
      else if (a === 'save-now') openTxForm(null, { type: 'transfer', account: mainAccount(), toAccount: defaultSavingAcc(''), note: 'ออมเงิน' });
      else if (a === 'add-rec-save') openRecForm(null, { type: 'transfer', account: mainAccount(), toAccount: defaultSavingAcc(''), dayOfMonth: 1, note: 'ออมอัตโนมัติ' });
      else if (a === 'backup') {
        act.disabled = true;
        try { const r = await api('backupNow'); toast('สำรองข้อมูลแล้ว: ' + r.name); await refresh(); } catch (err) { toast(err.message, 'error'); }
        act.disabled = false;
      } else if (a === 'run-rec') {
        try { const n = await api('runRecurringNow'); toast(n ? `สร้าง ${n} รายการ` : 'ไม่มีรายการที่ถึงกำหนด'); await refresh(); } catch (err) { toast(err.message, 'error'); }
      }
      return;
    }
    const et = el('[data-edit-tx]'); if (et) { openTxForm(S.tx.find((t) => t.id === et.dataset.editTx)); return; }
    const dt = el('[data-del-tx]'); if (dt) { deleteTx(dt.dataset.delTx); return; }
    const ea = el('[data-edit-acc]'); if (ea) { openAccForm(S.accById[ea.dataset.editAcc]); return; }
    const ec = el('[data-edit-cat]'); if (ec) { openCatForm(S.catById[ec.dataset.editCat]); return; }
    const eg = el('[data-edit-goal]'); if (eg) { openGoalForm(S.goals.find((g) => g.id === eg.dataset.editGoal)); return; }
    const sv = el('[data-save-to]');
    if (sv) { const to = sv.dataset.saveTo; openTxForm(null, { type: 'transfer', account: mainAccount(to), toAccount: to, note: 'ออมเงิน' }); return; }
    const er = el('[data-edit-rec]'); if (er) { openRecForm(S.recurring.find((r) => r.id === er.dataset.editRec)); return; }
    const dr = el('[data-del-rec]');
    if (dr) {
      if (await confirmDialog('ลบรายการประจำนี้?', 'รายการที่บันทึกไปแล้วจะยังอยู่ ระบบจะหยุดสร้างรายการใหม่เท่านั้น')) {
        try { await api('deleteRecurring', dr.dataset.delRec); toast('ลบรายการประจำแล้ว'); await refresh(); } catch (err) { toast(err.message, 'error'); }
      }
      return;
    }
    const tr = el('[data-toggle-rec]');
    if (tr) {
      const r = S.recurring.find((x) => x.id === tr.dataset.toggleRec);
      try { await api('saveRecurring', { ...r, active: !r.active }); toast(r.active ? 'หยุดรายการประจำแล้ว' : 'เปิดใช้งานแล้ว'); await refresh(); } catch (err) { toast(err.message, 'error'); }
      return;
    }
    const fc = el('[data-focus-cat]');
    if (fc && !el('button[data-edit-tx]')) {
      S.focusCat = fc.dataset.focusCat;
      if (S.view !== 'analysis') { go('analysis'); setTimeout(() => $('#catDeep') && $('#catDeep').scrollIntoView({ behavior: 'smooth' }), 80); }
      else { renderCatDeep(); $('#catDeep').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      return;
    }
    const sb = el('[data-set-budget]');
    if (sb) {
      try { await api('setBudget', sb.dataset.setBudget, +sb.dataset.amount); toast('ตั้งงบแล้ว'); await refresh(); } catch (err) { toast(err.message, 'error'); }
      return;
    }
    const mx = el('[data-matrix]');
    if (mx) { S.matrixMonths = +mx.dataset.matrix; renderAnalysis(); icons(); return; }
    const ft = el('[data-ftype]');
    if (ft) { S.filters.type = ft.dataset.ftype; S.page = 1; $$('[data-ftype]').forEach((b) => b.setAttribute('aria-pressed', String(b === ft))); renderTxResults(); return; }
    const pg = el('[data-page]');
    if (pg && !pg.disabled) { S.page = +pg.dataset.page; renderTxResults(); $('#view-transactions').scrollIntoView(); return; }
    const th = el('[data-theme]');
    if (th) { localStore('theme', th.dataset.theme); applyTheme(); render(); return; }
  });

  document.addEventListener('change', async (e) => {
    const t = e.target;
    if (t.id === 'focusSel') { S.focusCat = t.value; renderCatDeep(); }
    else if (t.id === 'fCat') { S.filters.category = t.value; S.page = 1; renderTxResults(); }
    else if (t.id === 'fAcc') { S.filters.account = t.value; S.page = 1; renderTxResults(); }
    else if (t.id === 'backupToggle') {
      try { S.settings = await api('saveSettings', { backupEnabled: t.checked }); toast(t.checked ? 'เปิดการสำรองอัตโนมัติแล้ว' : 'ปิดการสำรองอัตโนมัติแล้ว'); }
      catch (err) { t.checked = !t.checked; toast(err.message, 'error'); }
    } else if (t.dataset.budget) {
      const c = S.catById[t.dataset.budget];
      const v = Math.max(0, +t.value || 0);
      if (c && v !== c.monthlyBudget) {
        try { await api('setBudget', c.id, v); toast(v ? `ตั้งงบ ${c.name} ${money(v)} แล้ว` : `ยกเลิกงบ ${c.name} แล้ว`); await refresh(); } catch (err) { toast(err.message, 'error'); }
      }
    }
  });
  let qT;
  document.addEventListener('input', (e) => {
    if (e.target.id === 'fQ') { clearTimeout(qT); qT = setTimeout(() => { S.filters.q = e.target.value; S.page = 1; renderTxResults(); }, 200); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('#modalRoot').innerHTML) closeModal();
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.budget) e.target.blur();
  });
}

(async function init() {
  applyTheme();
  if (!IS_GAS) $('#demoBanner').classList.remove('hidden');
  $('#sideNav').innerHTML = Object.entries(VIEWS).map(([k, v]) => `<button type="button" class="nav-link w-full" data-nav="${k}" data-go="${k}"><i data-lucide="${v.icon}"></i>${v.title}</button>`).join('');
  S.periodKey = 'm:' + monthOf(S.today);
  bind();
  icons();
  try {
    const d = await api('bootstrap');
    apply(d);
    S.periodKey = 'm:' + monthOf(S.today);
    $('#periodSel').innerHTML = periodOptions().map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
    $('#periodSel').value = S.periodKey;
    $('#loading').classList.add('hidden');
    route();
    if (d.recurringGenerated) toast(`บันทึกรายการประจำให้อัตโนมัติ ${d.recurringGenerated} รายการ`);
  } catch (e) {
    $('#loading').innerHTML = `<i data-lucide="circle-alert" class="inline-block !w-7 !h-7 text-expense"></i><p class="mt-3 font-medium">โหลดข้อมูลไม่สำเร็จ</p><p class="sub mt-1">${esc(e.message)}</p><button class="btn btn-ghost mt-4" onclick="location.reload()">ลองใหม่</button>`;
    icons();
  }
})();
</script>
</body>
</html>
